{{define "content"}}

<div class="dashboard-header">
    <h2>Dashboard</h2>
    <a class="btn" href="/admin/new">New Article</a>
</div>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Tags</th>
            <th>Comments</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {{range .Articles}}
        <tr>
            <td><a href="/article/{{.ID}}">{{.Title}}</a></td>
            <td>
                {{if .Category}}
                <a class="category-badge" href="/category/{{.Category}}">{{.Category}}</a>
                {{else}}—{{end}}
            </td>
            <td>
                {{if .Tags}}
                <div class="tags">
                    {{range .Tags}}<a class="tag" href="/tag/{{.}}">{{.}}</a>{{end}}
                </div>
                {{else}}—{{end}}
            </td>
            <td>{{len .Comments}}</td>
            <td>{{formatDate .PublishedAt}}</td>
            <td>
                <a href="/admin/edit/{{.ID}}">Edit</a>
                |
                <form action="/admin/delete/{{.ID}}" method="POST" style="display:inline;">
                    <button type="submit" class="danger">Delete</button>
                </form>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>

{{end}}
